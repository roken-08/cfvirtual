name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Check (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-15, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Linux C toolchain (bundled SQLite)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends build-essential pkg-config
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.99.1 --profile minimal --component rustfmt --component clippy
      - name: Show repository toolchain
        run: rustup show active-toolchain
      - name: Fetch locked dependencies
        run: cargo fetch --locked
      - name: Formatting
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Offline tests (fixtures and local mock servers)
        run: cargo test --locked --offline
      - name: Release build
        run: cargo build --locked --release
      - name: Accelerated offline demo
        run: cargo run --locked --offline --release -- demo --seed 42 --json
